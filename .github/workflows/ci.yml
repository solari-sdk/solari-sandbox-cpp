name: CI

# Offline build and tests only. No secrets, no network beyond the loopback mocks, nothing is published.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The conformance rows run against a mock gateway written in JavaScript (tests/conformance/mock-server.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conformance copy matches its pinned source
        run: tests/conformance/check-source.sh
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libcurl4-openssl-dev libssl-dev
      - name: Configure
        # A plain default configure, as a user's first try (CMake 4 used to reject doctest 2.4.11's cmake_minimum_required < 3.5).
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: ctest
        run: ctest --test-dir build --output-on-failure
